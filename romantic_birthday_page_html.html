<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday My Love</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#ff4e8a,#ffb6c1,#ff6fa5);
      background-size:400% 400%;
      animation:bgMove 10s infinite alternate;
      color:white;
      text-align:center;
      overflow-x:hidden;
    }

    @keyframes bgMove{
      0%{background-position:left;}
      100%{background-position:right;}
    }

    .container{
      width:100%;
      padding:30px 15px;
      position:relative;
      z-index:2;
    }

    h1{
      font-size:55px;
      margin-bottom:20px;
      text-shadow:0 0 20px rgba(255,255,255,0.8);
      animation:glow 2s infinite alternate;
    }

    @keyframes glow{
      from{transform:scale(1);}
      to{transform:scale(1.05);}
    }

    .section{
      margin:70px auto;
      max-width:900px;
      background:rgba(255,255,255,0.15);
      padding:25px;
      border-radius:25px;
      backdrop-filter:blur(10px);
      animation:fadeIn 1.5s ease;
      box-shadow:0 0 30px rgba(255,255,255,0.3);
      transition:0.5s;
    }

    .section:hover{
      transform:scale(1.02);
    }

    .gallery{
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
      margin-top:20px;
      margin-bottom:20px;
    }

    .gallery img{
      width:250px;
      height:250px;
      object-fit:cover;
      border-radius:20px;
      border:4px solid white;
      transition:0.5s;
      box-shadow:0 0 25px rgba(255,255,255,0.6);
    }

    .gallery img:hover{
      transform:scale(1.08) rotate(2deg);
    }

    p{
      font-size:22px;
      line-height:1.8;
      margin-top:10px;
      animation:fadeText 2s ease;
    }

    @keyframes fadeText{
      from{opacity:0;}
      to{opacity:1;}
    }

    .heart{
      font-size:80px;
      animation:pulse 1s infinite;
    }

    .cake{
      font-size:90px;
      margin:20px 0;
      animation:spinCake 4s linear infinite;
    }

    @keyframes spinCake{
      0%{transform:rotate(0deg);}
      100%{transform:rotate(360deg);}
    }

    @keyframes pulse{
      0%{transform:scale(1)}
      50%{transform:scale(1.2)}
      100%{transform:scale(1)}
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .floating{
      position:fixed;
      bottom:-100px;
      font-size:50px;
      animation:float 10s infinite linear;
      opacity:0.8;
      z-index:1;
    }

    .floating:nth-child(1){left:5%;animation-duration:7s;}
    .floating:nth-child(2){left:15%;animation-duration:9s;}
    .floating:nth-child(3){left:30%;animation-duration:8s;}
    .floating:nth-child(4){left:45%;animation-duration:10s;}
    .floating:nth-child(5){left:60%;animation-duration:6s;}
    .floating:nth-child(6){left:75%;animation-duration:11s;}
    .floating:nth-child(7){left:90%;animation-duration:7s;}

    @keyframes float{
      0%{transform:translateY(0) rotate(0deg)}
      100%{transform:translateY(-120vh) rotate(360deg)}
    }

    .sparkle{
      position:fixed;
      width:10px;
      height:10px;
      background:white;
      border-radius:50%;
      animation:spark 4s infinite;
      opacity:0.8;
      z-index:0;
    }

    @keyframes spark{
      0%{transform:translateY(0) scale(1);opacity:1;}
      100%{transform:translateY(-100vh) scale(0);opacity:0;}
    }

    @media(max-width:700px){
      .gallery img{
        width:90%;
        height:auto;
      }

      h1{
        font-size:35px;
      }

      p{
        font-size:18px;
      }
    }
  </style>
</head>
<body>

  <audio autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="floating">🎂</div>
  <div class="floating">🎈</div>
  <div class="floating">🎉</div>
  <div class="floating">🍰</div>
  <div class="floating">🎊</div>
  <div class="floating">🧁</div>
  <div class="floating">❤️</div>

  <div class="sparkle" style="left:10%; bottom:0;"></div>
  <div class="sparkle" style="left:30%; bottom:10%; animation-duration:6s;"></div>
  <div class="sparkle" style="left:50%; bottom:20%; animation-duration:5s;"></div>
  <div class="sparkle" style="left:70%; bottom:5%; animation-duration:7s;"></div>
  <div class="sparkle" style="left:90%; bottom:15%; animation-duration:4s;"></div>
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>
  <div class="balloon">🎈</div>

  <div class="container">

    <div class="heart">❤️</div>

    <div class="cake">🎂</div>

    <h1>Happy Birthday My Love 🎂</h1>

    <div class="section">
      <div class="gallery">
        <img src="pic1.jpg">
        <img src="pic2.jpg">
      </div>

      <p>
        Write your first romantic message here ❤️
      </p>
    </div>

    <div class="section">
      <div class="gallery">
        <img src="pic3.jpg">
        <img src="pic4.jpg">
        <img src="pic5.jpg">
      </div>

      <p>
        Add another beautiful memory message ✨
      </p>
    </div>

    <div class="section">
      <div class="gallery">
        <img src="pic6.jpg">
        <img src="pic7.jpg">
      </div>

      <p>
        You are the best thing in my life 💕
      </p>
    </div>

    <div class="section">
      <div class="gallery">
        <img src="pic8.jpg">
        <img src="pic9.jpg">
      </div>

      <p>
        Every moment with you feels magical ❤️✨
      </p>

      <div class="gallery">
        <img src="pic10.jpg">
      </div>

      <p>
        Happy Birthday My Love ❤️ Forever Together 🎉
      </p>
    </div>

  </div>

</body>
</html>
